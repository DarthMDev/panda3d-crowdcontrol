name: Tests and package

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.8", "3.10", "3.12", "3.13"]
        engine: [stable]
        include:
          - os: windows-latest
            python: "3.10"
            engine: stable
          - os: macos-latest
            python: "3.10"
            engine: stable
          - os: ubuntu-latest
            python: "3.10"
            engine: devel
          - os: windows-latest
            python: "3.10"
            engine: devel
          - os: macos-latest
            python: "3.10"
            engine: devel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.engine == 'stable'
        run: python -m pip install "panda3d>=1.10.15,<1.11"
      - if: matrix.engine == 'devel'
        run: python -m pip install --pre --index-url https://archive.panda3d.org/simple/ "panda3d>=1.11.0.dev0"
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          with ZipFile(next(Path("dist").glob("*.whl"))) as wheel:
              name = next(n for n in wheel.namelist() if n.endswith("/METADATA"))
              version = BytesParser().parsebytes(wheel.read(name))["Version"]
          module = ast.parse(Path("panda3d_crowdcontrol/__init__.py").read_text())
          source_version = next(
              ast.literal_eval(node.value)
              for node in module.body if isinstance(node, ast.Assign)
              if any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets)
          )
          if source_version != version or os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag, package metadata, and __version__ must match")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
